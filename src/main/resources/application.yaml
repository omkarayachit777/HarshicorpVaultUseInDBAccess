spring:
  application:
    name: vaultDB # this is vault secret's path & must have given as application name only to access vaultDb -> db.username and db.password

  cloud:
    vault:
      kv:
        enabled: true
        backend: secret
      authentication: TOKEN
      token: hvs.BA********IZm #this is token generated after vault server start
      scheme: http
      host: 127.0.0.1 #this is IP address of vault where it is hosted on
      port: 8200

  config:
    import: vault://

  datasource:
    url: jdbc:mysql://localhost:3306/vaultdb?createDatabaseIfNotExist=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect